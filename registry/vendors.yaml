# Top-level list of Vendor objects (see Vendor in src/types.ts).
# One entry = one service (Firebase and Google Analytics are separate entries).
# names: every name a privacy policy might use (service, legal entity, Korean spelling). ASCII names match
#   case-insensitively on word boundaries, so an ordinary English word must not go here.
# strictNames (optional): names that are also ordinary words (Resend, Meta, Segment). Matched case-sensitively
#   as whole words: "Resend" counts, "we resend" does not.
# packages: npm / gradle (artifact or group) / pip names; a trailing * means prefix match.
# domains: host names that show up in code or config. host/path-prefix (googletagmanager.com/gtm.js) matches that path only.
# trackers: browser call patterns (optional). parent: id of the parent vendor (optional).
# country: ISO-3166 alpha-2 of the legal entity's HQ.
# source: official URL (vendor's own policy / legal / company page) that supports the entity or country (required).
# Parent entries (google, microsoft, meta, kakao, okta, twilio) exist so a policy that names only the parent
# can be reported as "uncertain" rather than "missing".

