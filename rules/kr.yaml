# One RulePack object (see RulePack in src/types.ts): contents a Korean 개인정보 처리방침 must state.
# sections: keywords are matched as plain text; any one match counts as "stated".
# Keywords list both spaced and unspaced phrasings because real policies vary.
# basis: article read in the statute text (개인정보 보호법 제30조, 시행령 제31조, 제28조의8), or "미확인".
# 근거 조문은 2026-11-12 에 법제처 국가법령정보 Open API(law.go.kr)의 현행 본문과 대조했다.
#   개인정보 보호법 (시행 2026-09-11) 제30조, 제28조의8 / 개인정보 보호법 시행령 (시행 2026-11-10) 제31조
# 법 제30조 제1항 제3호의3(민감정보 공개 가능성), 제4호의2(가명정보 처리), 시행령 제31조 제1항 제4호(국외에서 직접 수집)는
# "해당되는 경우에만" 적는 항목이라 sections 에 넣지 않았다.
# 개인정보보호위원회 「개인정보 처리방침 작성지침」의 항목 목록 원문은 열어 보지 못했다.
jurisdiction: kr
sections:
  - id: purpose
    title: 개인정보의 처리 목적
    keywords: [처리 목적, 처리목적, 수집 목적, 수집·이용 목적, 이용 목적, 이용목적, 목적으로 처리, 목적으로 이용, 목적으로 수집]
    basis: 개인정보 보호법 제30조 제1항 제1호
  - id: items
    title: 처리하는 개인정보의 항목
    keywords: [처리하는 개인정보의 항목, 개인정보의 항목, 처리 항목, 처리항목, 수집 항목, 수집항목, 수집하는 개인정보, 수집하는 항목, 수집하는 개인정보 항목, 필수항목, 필수 항목, 선택항목, 선택 항목]
    basis: 개인정보 보호법 시행령 제31조 제1항 제1호 (법 제30조 제1항 제8호의 대통령령 위임)
  - id: retention
    title: 개인정보의 처리 및 보유 기간
    keywords: [보유 기간, 보유기간, 이용 기간, 이용기간, 처리 및 보유, 보유 및 이용, 보존 기간, 보존기간, 보관 기간, 보관기간, 파기할 때까지, 탈퇴 시까지, 탈퇴시까지, 회원 탈퇴 시]
    basis: 개인정보 보호법 제30조 제1항 제2호
  - id: third_party
    title: 개인정보의 제3자 제공
    keywords: [제3자 제공, 제3자에게 제공, 제3자 에게 제공, 제 3자 제공, 제공받는 자, 제공받는자, 제3자에 대한 제공, 개인정보를 제공하지 않, 제공하지 않습니다, 제공 받는 자]
    basis: 개인정보 보호법 제30조 제1항 제3호
  - id: destruction
    title: 개인정보의 파기 절차 및 방법
    keywords: [파기 절차, 파기절차, 파기 방법, 파기방법, 파기합니다, 파기하며, 파기한다, 파기 시점, 지체 없이 파기, 복구할 수 없, 복구 불가능, 개인정보의 파기, 개인정보 파기]
    basis: 개인정보 보호법 제30조 제1항 제3호의2
  - id: outsourcing
    title: 개인정보 처리의 위탁
    keywords: [처리 위탁, 처리위탁, 처리의 위탁, 업무 위탁, 업무위탁, 위탁 업무, 위탁업무, 위탁받는 자, 수탁자, 수탁업체, 수탁 업체, 위탁하고 있, 위탁합니다, 위탁하는 업무]
    basis: 개인정보 보호법 제30조 제1항 제4호
  - id: rights
    title: 정보주체와 법정대리인의 권리·의무 및 행사 방법
    keywords: [정보주체의 권리, 정보주체 권리, 정보주체와 법정대리인, 정보주체의 권리·의무, 권리·의무, 열람, 정정·삭제, 정정 및 삭제, 처리정지, 처리 정지, 열람 요구, 권리 행사, 권리행사, 동의 철회, 동의철회, 법정대리인]
    basis: 개인정보 보호법 제30조 제1항 제5호
  - id: officer
    title: 개인정보 보호책임자 또는 고충처리 담당 부서
    keywords: [보호책임자, 개인정보 보호 책임자, 개인정보보호 책임자, 개인정보 보호책임자, 개인정보관리책임자, 개인정보 관리책임자, 고충처리, 고충 처리, 개인정보 보호 담당 부서, 개인정보 담당 부서, 개인정보보호담당자, 개인정보 보호담당자, 개인정보 열람청구 접수]
    basis: 개인정보 보호법 제30조 제1항 제6호
  - id: cookies
    title: 자동 수집 장치(쿠키 등)의 설치·운영 및 거부
    keywords: [쿠키, cookie, 자동으로 수집하는 장치, 자동 수집 장치, 자동수집장치, 자동 수집, 접속 로그, 로그 파일, 접속로그, 로그파일, 자동으로 수집, 행태정보, 맞춤형 광고, 거부 방법, 설치·운영]
    basis: 개인정보 보호법 제30조 제1항 제7호
  - id: safety
    title: 개인정보의 안전성 확보 조치
    keywords: [안전성 확보 조치, 안전성 확보조치, 안전성확보조치, 안전성 확보, 안전성확보, 안전조치, 안전 조치, 기술적 대책, 관리적 대책, 기술적·관리적, 기술적 보호, 관리적 보호, 접근 통제, 접근통제, 암호화, 내부관리계획, 내부 관리계획]
    basis: 개인정보 보호법 시행령 제31조 제1항 제3호 (법 제30조 제1항 제8호의 대통령령 위임)
  - id: policy_change
    title: 개인정보 처리방침의 변경
    keywords: [처리방침의 변경, 처리방침 변경, 처리방침이 변경, 방침의 변경, 방침 변경, 방침이 변경, 변경 이력, 변경이력, 시행일자, 시행일, 공고일자, 공지사항을 통하여, 변경 사항, 변경사항, 이전 버전, 이전 처리방침]
    basis: 개인정보 보호법 제30조 제2항 (처리방침을 수립하거나 변경한 경우 공개 의무). 변경 항목 자체를 처리방침에 넣으라는 근거는 작성지침 항목이라 미확인
# 국외 이전(개인정보 보호법 시행령 제31조 제1항 제2호, 법 제28조의8 제1항 각 호에 따른 국외 이전의 근거와 같은 조 제2항 각 호의 사항)은
# sections 에 두지 않는다. 본사가 국외인 서비스가 코드에 있을 때만 아래 키워드로 한 번 검사한다 (cross_border_missing_candidate).
crossBorderKeywords: [국외 이전, 국외이전, 해외 이전, 해외이전, 국외로 이전, 해외로 이전, 국외 제공, 국외로 제공, 해외 제공, 해외로 제공, 국외 위탁, 해외 위탁, 국외 보관, 해외 보관, 해외 서버, 국외 서버, 국외 처리, 해외 소재, 국외 소재, 이전되는 국가, 이전 국가, 이전받는 국가]
# 7일 / 30일 은 관행적 기본값이다 (법령에서 확인한 값이 아님): 일반 변경은 시행 7일 전, 이용자에게 불리한 변경은 30일 전 공지.
notice:
  defaultDays: 7
  adverseDays: 30
